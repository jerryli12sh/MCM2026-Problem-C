# Continuous integration for the public DWTS reproduction repository.
#
# Design boundary (see docs/CI.md for the full rationale):
#   The full 229-test suite, the 20-row baseline comparison, `hash_inputs.py
#   --validate`, and the ~23-minute release pipeline all read the external
#   read-only **source bundle** (contest data, submitted paper, review note,
#   legacy implementation/outcomes — 174 hashed files). That bundle is not
#   redistributed with this repository and cannot exist in a public CI
#   checkout. This workflow therefore runs the *hermetic* gate — every check
#   that needs only the committed repository — so a third party can see the
#   code is formatted, typed, internally consistent, and passes its pure-logic
#   test set. The data-bound suite is the owner's local gate (`make
#   phase0-accept`; see docs/CI.md and docs/ENVIRONMENT.md).
#
# ruff and mypy are pinned to the versions that produced the recorded release,
# because `ruff format` output and mypy diagnostics evolve between releases and
# an unpinned install would turn this workflow red through version drift rather
# than an actual defect. The exact third-party environment is frozen in
# docs/python313-release-freeze-20260903.txt.

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hermetic-gates:
    name: format · lint · type · hermetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package + analysis/dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev]"
          # Pin the toolchain that produced the recorded release evidence.
          python -m pip install "ruff==0.16.5" "mypy==2.3.1"

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy src/dwts_reproduction

      - name: Compile all modules (incl. data-bound ones not run here)
        run: python -m compileall -q src scripts

      - name: Hermetic test selection (81 tests; no external source bundle)
        # Only modules whose tests need committed repo files. The six
        # `--deselect`ed tests read the external source bundle and are covered
        # by the owner's local `make phase0-accept`. See docs/CI.md.
        run: |
          python -m pytest -q \
            tests/test_config.py \
            tests/test_hashing.py \
            tests/test_mechanism_phase.py \
            tests/test_problem2_rules.py \
            tests/test_release_compare.py \
            tests/test_run_manifest.py \
            tests/test_scope.py \
            tests/test_inventory_completeness.py \
            tests/test_sensitivity.py \
            tests/test_smoke.py \
            --deselect tests/test_mechanism_phase.py::test_real_phase_metrics_structural_p \
            --deselect tests/test_inventory_completeness.py::test_paper_figures_covered \
            --deselect tests/test_inventory_completeness.py::test_paper_tables_covered \
            --deselect tests/test_sensitivity.py::test_panel_with_variant_preserves_shape_on_real_data \
            --deselect tests/test_smoke.py::test_raw_shape \
            --deselect tests/test_smoke.py::test_run_smoke_checks_pass
