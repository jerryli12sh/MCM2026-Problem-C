# Public, source-free quality gate. The full numerical suite needs the external
# read-only contest source bundle; see docs/CI.md. Ruff and mypy are pinned to
# the versions used for the recorded release.

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hermetic-gates:
    name: format · lint · type · hermetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install recorded dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy src/dwts_reproduction

      - name: Compile all modules (incl. data-bound ones not run here)
        run: python -m compileall -q src scripts

      - name: Source-free tests
        # Six data-bound cases in otherwise source-free modules are explicitly
        # deselected. The complete list and rationale live in docs/CI.md.
        run: |
          python -m pytest -q \
            tests/test_config.py \
            tests/test_hashing.py \
            tests/test_mechanism_phase.py \
            tests/test_problem2_rules.py \
            tests/test_release_compare.py \
            tests/test_run_manifest.py \
            tests/test_inventory_completeness.py \
            tests/test_sensitivity.py \
            tests/test_smoke.py \
            --deselect tests/test_mechanism_phase.py::test_real_phase_metrics_structural_p \
            --deselect tests/test_inventory_completeness.py::test_paper_figures_covered \
            --deselect tests/test_inventory_completeness.py::test_paper_tables_covered \
            --deselect tests/test_sensitivity.py::test_panel_with_variant_preserves_shape_on_real_data \
            --deselect tests/test_smoke.py::test_raw_shape \
            --deselect tests/test_smoke.py::test_run_smoke_checks_pass
