[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwts-reproduction"
version = "1.0.0"
description = "Fan-support inference and voting-rule analysis for MCM 2026 Problem C"
requires-python = ">=3.13"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2", "statsmodels>=0.14,<1", "PyYAML>=6,<7", "xgboost>=2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: fits models or checks full data tables"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
