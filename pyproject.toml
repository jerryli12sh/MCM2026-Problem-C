[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwts-reproduction"
version = "0.1.0"
description = "Faithful reproduction of the DWTS MCM paper (Track P) with a review-corrected variant (Track R)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The core package is numpy/pandas only; the softmin model uses a hand-written
# Adam optimizer so no torch is required.  These extras cover the downstream
# analyses and figures.
analysis = [
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xgboost>=1.7",
]
torch = ["torch>=2.0"]
xgboost = ["xgboost>=1.7"]
statsmodels = ["statsmodels>=0.14"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["outputs", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is enforced by `ruff format`, not lint

[tool.mypy]
# Type-check against the validated interpreter (Python 3.13), not the 3.11 floor:
# installed numpy 2.x inline stubs use 3.12-only `type` statements, so a 3.11
# mypy target fails inside numpy before it checks our code. 3.11-compatible
# *syntax* is instead enforced by ruff's target-version = "py311" above.
# Support matrix: requires-python >= 3.11 (syntax-gated); type-checked and
# validated on Python 3.13 (the documented release environment).
python_version = "3.13"
files = ["src/dwts_reproduction"]
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
# pandas, scipy, sklearn, statsmodels, matplotlib, and xgboost do not ship
# complete inline stubs; their calls are treated as Any while our own function
# signatures and internal consistency are still checked.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The `slow` marker tags tests that build the full preprocess tables (a few
# seconds each) so they can be deselected for a quick pass.
markers = ["slow: builds full tables / runs a full fit on real data"]
